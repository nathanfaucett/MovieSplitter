<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Template</title>
</head>

<body>
    <div id="TemplateConfigPage" data-role="page" class="page type-interior pluginConfigurationPage"
        data-require="emby-input,emby-button,emby-select,emby-checkbox">
        <div data-role="content">
            <div class="content-primary">

                <div class="verticalSection">
                    <h2 class="sectionTitle">Movie Splitter</h2>
                </div>

                <div class="inputContainer">
                    <label class="inputLabel" for="detectorMode">Detection mode</label>
                    <select id="detectorMode" class="emby-select-withcolor emby-select">
                        <option value="Heuristic">Heuristic</option>
                        <option value="Ollama">Ollama LLM only</option>
                    </select>
                </div>

                <div class="verticalSection">
                    <h3 class="sectionTitle">Heuristic settings</h3>
                </div>

                <div class="inputContainer">
                    <label class="inputLabel" for="silenceThreshold">Silence gap threshold (seconds)</label>
                    <input type="number" id="silenceThreshold" class="emby-input" min="5" max="300" step="1" />
                </div>

                <div class="inputContainer">
                    <label class="inputLabel" for="targetEpisodeMinutes">Target episode length (minutes)</label>
                    <input type="number" id="targetEpisodeMinutes" class="emby-input" min="1" max="120" step="1" />
                </div>

                <div class="verticalSection">
                    <h3 class="sectionTitle">Ollama LLM settings</h3>
                </div>

                <div class="inputContainer">
                    <label class="inputLabel" for="ollamaUrl">Ollama server URL</label>
                    <input type="text" id="ollamaUrl" class="emby-input"
                        placeholder="http://host.docker.internal:11434" />
                </div>

                <div class="inputContainer">
                    <label class="inputLabel" for="ollamaModel">Model name</label>
                    <input type="text" id="ollamaModel" class="emby-input" placeholder="gemma4:e2b" />
                </div>

                <div class="inputContainer">
                    <button id="testOllama" class="emby-button button-submit">Test connection</button>
                    <span id="ollamaStatus" style="margin-left:12px;font-size:0.9em;"></span>
                </div>

                <div class="verticalSection">
                    <h3 class="sectionTitle">Output settings</h3>
                </div>

                <div class="inputContainer">
                    <label class="inputLabel" for="outputSubfolder">Output subfolder name</label>
                    <input type="text" id="outputSubfolder" class="emby-input" />
                </div>

                <div class="inputContainer">
                    <label class="inputLabel" for="subtitleLanguage">Subtitle language code</label>
                    <input type="text" id="subtitleLanguage" class="emby-input" placeholder="eng" maxlength="3" />
                </div>

                <div class="inputContainer">
                    <button id="btnSave" class="emby-button button-submit">Save settings</button>
                </div>

            </div>
        </div>
        <script type="text/javascript">
            (() => {
                const pluginId = 'b2be5f82-6324-4e02-a66c-6da5a160ac45';

                async function loadConfig() {
                    const res = await ApiClient.getPluginConfiguration(pluginId);
                    document.getElementById('detectorMode').value = res.DetectorMode ?? 'Ollama';
                    document.getElementById('silenceThreshold').value = res.SilenceThresholdSeconds ?? 60;
                    document.getElementById('targetEpisodeMinutes').value = res.TargetEpisodeMinutes ?? 30;
                    document.getElementById('ollamaUrl').value = res.OllamaUrl ?? 'http://host.docker.internal:11434';
                    document.getElementById('ollamaModel').value = res.OllamaModel ?? 'gemma4:e2b';
                    document.getElementById('outputSubfolder').value = res.OutputSubfolder ?? 'Episodes';
                    document.getElementById('subtitleLanguage').value = res.SubtitleLanguage ?? 'en';
                }

                function collectConfig() {
                    return {
                        DetectorMode: document.getElementById('detectorMode').value,
                        SilenceThresholdSeconds: Number.parseFloat(document.getElementById('silenceThreshold').value),
                        TargetEpisodeMinutes: Number.parseFloat(document.getElementById('targetEpisodeMinutes').value),
                        OllamaUrl: document.getElementById('ollamaUrl').value.trim(),
                        OllamaModel: document.getElementById('ollamaModel').value.trim(),
                        OutputSubfolder: document.getElementById('outputSubfolder').value.trim(),
                        SubtitleLanguage: document.getElementById('subtitleLanguage').value.trim(),
                    };
                }

                async function saveConfig() {
                    await ApiClient.updatePluginConfiguration(pluginId, collectConfig());
                    Dashboard.processPluginConfigurationUpdateResult();
                }

                async function testOllama() {
                    const url = document.getElementById('ollamaUrl').value.trim();
                    const status = document.getElementById('ollamaStatus');
                    status.textContent = 'Testing…';
                    try {
                        const res = await ApiClient.ajax({
                            type: 'GET',
                            url: ApiClient.getUrl('MovieSplitter/TestOllama', { ollamaUrl: url }),
                            dataType: 'json'
                        });
                        status.textContent = res.Ok ? '✓ Connected' : `✗ ${res.Error}`;
                    } catch {
                        status.textContent = '✗ Could not reach Jellyfin API';
                    }
                }

                document.getElementById('btnSave').addEventListener('click', saveConfig);
                document.getElementById('testOllama').addEventListener('click', testOllama);

                loadConfig();
            })();
        </script>
    </div>
</body>

</html>
